<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5ef">
  <meta name="description" content="我的旅行收藏：用自己的照片，連結每一次出發。">
  <title>我的旅行收藏</title>
  <style>
    /* 配色：想換顏色可以修改這裡。 */
    :root {
      --paper: #f7f5ef;
      --ink: #303c34;
      --muted: #778075;
      --line: #dedfd4;
      --green: #405845;
      --accent: #a15b3f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 15px/1.7 -apple-system, BlinkMacSystemFont, 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    }
    a { color: inherit; text-decoration: none; }
    a:focus-visible { outline: 3px solid #b6774f; outline-offset: 5px; }
    header, main, footer { max-width: 1220px; margin: auto; }
    header {
      padding: 27px 36px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }
    .brand { font: 19px Georgia, 'Songti TC', serif; letter-spacing: 2px; }
    .brand span { color: var(--accent); margin-right: 8px; }
    .small { font-size: 11px; letter-spacing: 2px; color: var(--muted); }
    main { padding: 0 36px 80px; }
    .intro { padding: 65px 0 46px; position: relative; }
    .eyebrow { color: var(--accent); font: 11px monospace; letter-spacing: 3px; }
    h1 {
      font: 500 clamp(34px, 5vw, 54px)/1.5 Georgia, 'Songti TC', serif;
      letter-spacing: 3px;
      margin: 16px 0;
    }
    h1 em { font-style: normal; color: var(--green); }
    .intro p { color: var(--muted); font-size: 14px; margin: 12px 0; }
    .intro-mark {
      position: absolute;
      right: 20px;
      top: 64px;
      font: italic 78px/1 Georgia, serif;
      color: #d9dfcd;
      transform: rotate(-8deg);
      pointer-events: none;
    }
    .intro-mark small { display: block; font: 10px monospace; letter-spacing: 3px; margin-top: 12px; text-align: center; }
    .count { font-size: 12px; color: var(--muted); margin: 0 0 24px; }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px 26px; }
    .card { min-width: 0; }
    .card-link { display: block; }
    .cover {
      aspect-ratio: 4/3;
      background: #e8e9df;
      overflow: hidden;
      border-radius: 6px;
      position: relative;
      border: 1px solid #dedfd4;
    }
    .cover img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .35s; }
    .card-link:hover img { transform: scale(1.04); }
    .placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      color: #82917b;
      width: 100%;
      height: 100%;
      background: linear-gradient(150deg, #eef0e5, #e1e5d7);
    }
    .placeholder svg { width: 54px; height: 54px; margin-bottom: 12px; stroke: currentColor; stroke-width: 1; fill: none; }
    .placeholder span { font-size: 11px; letter-spacing: 2px; }
    .arrow {
      position: absolute;
      bottom: 14px;
      right: 15px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #f7f5efe8;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--green);
    }
    .caption { padding: 16px 1px 0; }
    .caption h2 { font: 500 20px Georgia, 'Songti TC', serif; line-height: 1.5; letter-spacing: 1px; margin: 0; overflow-wrap: anywhere; }
    .caption p { margin: 5px 0 0; font: 10px/1.6 monospace; color: var(--muted); letter-spacing: 1px; }
    footer {
      padding: 24px 36px;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      gap: 18px;
      font-size: 11px;
      color: var(--muted);
    }
    [hidden] { display: none !important; }
    @media (max-width: 780px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .intro-mark { display: none; }
    }
    @media (max-width: 510px) {
      header { padding: 20px 22px; }
      .small { font-size: 9px; letter-spacing: 1px; }
      main { padding: 0 22px 45px; }
      .intro { padding: 36px 0 26px; }
      h1 { font-size: 35px; }
      .grid { gap: 26px 16px; }
      .caption h2 { font-size: 17px; }
      .caption p { font-size: 9px; }
      .placeholder svg { width: 36px; height: 36px; margin-bottom: 5px; }
      .placeholder span { font-size: 9px; letter-spacing: 0; }
      footer { padding: 20px 22px; flex-direction: column; gap: 3px; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <header>
    <a href="#" class="brand"><span>✳</span>我的旅行收藏</a>
    <span class="small">MY LITTLE TRAVEL LIBRARY</span>
  </header>
  <main>
    <!-- 首頁標題和介紹文字可以直接在這裡修改。 -->
    <section class="intro">
      <div class="eyebrow">PLACES I KEEP, JOURNEYS I LOVE.</div>
      <h1>每一次出發，<br>都有自己的<em>一頁。</em></h1>
      <p>點照片，打開旅行。把想去的地方、走過的風景，都收在這裡。</p>
      <div class="intro-mark" aria-hidden="true">Bon voyage<small>COLLECT MOMENTS, KEEP MEMORIES.</small></div>
    </section>
    <p class="count" id="trip-count"></p>
    <div id="cards" class="grid"></div>
  </main>
  <footer>
    <span>把旅程留在這裡，把日子走成風景。</span>
    <span>YOUR PHOTOS. YOUR PLACES. YOUR OWN LITTLE WORLD.</span>
  </footer>

  <script>
    // =====================================================
    // ★ 新增或修改旅行：只需要改這個 trips 清單！
    // =====================================================
    // name  ：照片下方的旅行名稱。
    // url   ：點照片後開啟的網址，可以貼 https:// 完整網址。
    // image ：照片路徑，例如 images/image1.png。
    //         把照片放進 index.html 旁的 images 資料夾。
    //         每一筆的欄位都叫 image，照片檔名寫在引號裡。
    //         沒有照片時可以填 ""，頁面會顯示預設封面。
    //
    // 新增方法：複製下面一組 { ... }, 放在清單最後的 ]; 前面。
    // 每筆旅行後面保留逗號。清單由上往下，就是網頁的顯示順序。
    // 儲存 HTML 後重新整理網頁即可，不受舊瀏覽器儲存資料影響。

    const trips = [

      {
        name: "11月大邱大田之旅",
        url: "https://linjia930521-dotcom.github.io/Travel/Daegu26.html",
        image: "images/image2.png",
      },
      {
        name: "2026 濟州島實驗室之旅",
        url: "https://linjia930521-dotcom.github.io/2026Jeju/",
        image: "images/image4.png",
      },
      {
        name: "東京四日・旅の手帖",
        url: "https://linjia930521-dotcom.github.io/2026Tokyo/",
        image: "images/image1.png",
      },
      {
        name: "2026 紐西蘭南島之旅",
        url: "https://linjia930521-dotcom.github.io/2026Jeju/",
        image: "images/imageNZ.png",
      },
      {
        name: "2026 河西走廊之旅",
        url: "https://linjia930521-dotcom.github.io/Travel/2026河西走廊之旅.pdf",
        image: "images/image3.png",
      },
      {
        name: "2026 東海之旅",
        url: "https://linjia930521-dotcom.github.io/2026Jeju/",
        image: "images/image26D.png",
      },
      {
        name: "2025 清州大田之旅",
        url: "https://linjia930521-dotcom.github.io/2026Jeju/",
        image: "images/image2.png",
      },
      {
        name: "2025 山陽山陰之旅",
        url: "https://linjia930521-dotcom.github.io/2026Jeju/",
        image: "images/image25SS.jpg",
      },
      {
        name: "2025 英法之旅",
        url: "https://linjia930521-dotcom.github.io/2026Jeju/",
        image: "images/image25EF.jpg",
      },
      {
        name: "2425 大阪釜山之旅",
        url: "https://linjia930521-dotcom.github.io/2026Jeju/",
        image: "images/image24JK.jpg",
      },
      {
        name: "2024 長野新潟之旅",
        url: "https://linjia930521-dotcom.github.io/2026Jeju/",
        image: "images/image24NN.jpg",
      },
      {
        name: "2024 埃及之旅",
        url: "https://linjia930521-dotcom.github.io/2026Jeju/",
        image: "images/image24E.jpg",
      },
      {
        name: "2024 越南峴港河內之旅",
        url: "https://linjia930521-dotcom.github.io/2026Jeju/",
        image: "images/image24V.jpg",
      },
      // 新增範例：刪掉下面這五行開頭的 //，修改內容就會多一張卡片。
      // {
      //   name: "下一趟旅行的名稱",
      //   url: "https://example.com/my-trip.html",
      //   image: "images/my-trip.jpg",
      // },
    ];

    // =====================================================
    // 以下負責顯示卡片，平常不用修改。
    // =====================================================
    const cards = document.getElementById("cards");
    document.getElementById("trip-count").textContent =
      String(trips.length).padStart(2, "0") + " 趟旅行，慢慢收藏。";

    // 僅接受一般網頁網址或相對檔案路徑。
    function isAllowedPath(value) {
      if (typeof value !== "string" || !value.trim()) return false;
      if (/^[\s]*[a-z][a-z\d+.-]*:/i.test(value)) {
        return /^https?:\/\//i.test(value);
      }
      return !value.startsWith("//") && !/[\u0000-\u001f\u007f]/.test(value);
    }

    trips.forEach((trip, index) => {
      const card = document.createElement("article");
      card.className = "card";

      const link = document.createElement("a");
      link.className = "card-link";
      link.href = isAllowedPath(trip.url) ? trip.url : "#";
      link.target = "_blank";
      link.rel = "noopener noreferrer";

      const cover = document.createElement("div");
      cover.className = "cover";

      const placeholder = document.createElement("div");
      placeholder.className = "placeholder";
      placeholder.innerHTML = '<svg viewBox="0 0 64 64" aria-hidden="true"><rect x="9" y="12" width="46" height="38" rx="3"/><circle cx="23" cy="25" r="4"/><path d="M10 44l14-12 10 8 9-9 12 13"/></svg><span>旅途的風景，等你收藏</span>';
      placeholder.setAttribute("aria-hidden", "true");
      cover.append(placeholder);

      if (isAllowedPath(trip.image)) {
        const image = document.createElement("img");
        image.alt = ""; // 旅行名稱就在同一個連結中，不重複朗讀。
        image.loading = "eager";
        image.onload = () => { placeholder.hidden = true; image.hidden = false; };
        image.onerror = () => { placeholder.hidden = false; image.hidden = true; };
        image.hidden = true;
        image.src = trip.image;
        cover.append(image);
      }

      const arrow = document.createElement("span");
      arrow.className = "arrow";
      arrow.textContent = "↗";
      arrow.setAttribute("aria-hidden", "true");
      cover.append(arrow);

      const caption = document.createElement("div");
      caption.className = "caption";
      const title = document.createElement("h2");
      title.textContent = trip.name;
      const number = document.createElement("p");
      number.textContent = "JOURNEY " + String(index + 1).padStart(2, "0") +
        (/\.pdf(?:$|[?#])/i.test(trip.url) ? " · PDF" : " · TRAVEL NOTES");
      caption.append(title, number);
      link.append(cover, caption);
      card.append(link);
      cards.append(card);
    });
  </script>
</body>
</html>
